<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Foundation Schools</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js"></script>
</head>

<body>

  <header class="main-header" id="mainHeader">
    <div class="container">
      <img src="images/gfsbadge.png" alt="School Badge" class="school-badge" id="schoolBadge">

      <div class="school-info">
        <h1 id="schoolName">GOOD FOUNDATION SCHOOLS</h1>
        <h3>Masaka, Uganda</h3>
        <h3>
          Religion • Academic • Discpline
        </h3>
      </div>
    </div>
  </header>

  
<main class="campus-selector">
  <div class="side-gallery side-gallery-left">
    <div class="gallery-track">
      <img src="images/nye_h.png" alt="Nyendo Campus">
      <img src="images/kij_h.png" alt="Kijabwemi Campus">
      <img src="images/nat_h.png" alt="Natete Campus">
      <img src="images/gfsbadge.png" alt="Good Foundation Schools">
      <!-- Duplicate images for a continuous loop -->
      <img src="images/nye_h.png" alt="">
      <img src="images/kij_h.png" alt="">
      <img src="images/nat_h.png" alt="">
      <img src="images/gfsbadge.png" alt="">
    </div>
  </div>

  <div class="campus-center">
    <div class="container">
      <div class="campus-cards">
        <a href="./nye/a_index.html" class="campus-card nye">
          <img src="images/nye_h.png" alt="Nyendo Campus" class="campus-code">
          <h3>Nyendo Campus - Main Campus</h3>
          <p>Nursery &amp; Primary</p>
          <span class="btn">Enter Campus →</span>
        </a>

        <a href="./kij/index.html" class="campus-card kij">
          <img src="images/kij_h.png" alt="Kijabwemi Campus" class="campus-code">
          <h3>Kijabwemi Campus</h3>
          <p>Nursery &amp; Primary</p>
          <span class="btn">Enter Campus →</span>
        </a>

        <a href="./nat/index.html" class="campus-card nat">
          <img src="images/nat_h.png" alt="Natete Campus" class="campus-code">
          <h3>Natete Campus</h3>
          <p>Nursery &amp; Primary</p>
          <span class="btn">Enter Campus →</span>
        </a>
      </div>
    </div>
  </div>

  <div class="side-gallery side-gallery-right">
    <div class="gallery-track">
      <img src="images/nat_h.png" alt="Natete Campus">
      <img src="images/kij_h.png" alt="Kijabwemi Campus">
      <img src="images/nye_h.png" alt="Nyendo Campus">
      <img src="images/gfsbadge.png" alt="Good Foundation Schools">
      <img src="images/nat_h.png" alt="">
      <img src="images/kij_h.png" alt="">
      <img src="images/nye_h.png" alt="">
      <img src="images/gfsbadge.png" alt="">
    </div>
  </div>
</main>

  <footer>
    <div class="container">
      <p>&copy; 2026 gfsschools. All rights reserved.</p>
      <a href="www.zedtechonologies.com" style="color: white;">ZED TECHNOLOGIES&trade; </a>
    </div>
  </footer>

</body>

</html>
